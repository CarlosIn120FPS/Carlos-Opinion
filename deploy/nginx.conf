# Carlos' Opinion — configuración del contenedor nginx.
# Se monta en /etc/nginx/conf.d/default.conf.
#
# TLS y dominio NO se gestionan aquí: de eso se encarga Nginx Proxy Manager, que
# es el único punto de entrada HTTPS del homelab. Este nginx solo sirve ficheros
# en la LAN.
#
# OJO con `add_header`: nginx NO acumula estas directivas entre niveles. Un
# bloque location con aunque sea un add_header propio deja de heredar TODOS los
# del server. Por eso las cabeceras se repiten en cada location: puestas solo
# arriba no se aplicarían a ninguna respuesta.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Detrás de NPM, la IP de origen llega en X-Forwarded-For. Sin esto, todos
    # los accesos aparecerían en el log como si vinieran del proxy.
    set_real_ip_from 192.168.50.0/24;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # --- LO IMPRESCINDIBLE ---------------------------------------------------
    # La web tiene rutas propias (/anime, /manga/1...) que no son ficheros. Sin
    # esta línea, entrar directo a /anime da 404: nginx busca un fichero llamado
    # "anime" y no existe. Se le devuelve index.html y el router se encarga.
    location / {
        try_files $uri $uri/ /index.html;

        # index.html NO se cachea. Si se cachea, el navegador sigue pidiendo el
        # bundle viejo tras desplegar y parece que el despliegue no hizo nada.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --- CACHÉ ---------------------------------------------------------------
    # Los assets llevan hash en el nombre (index-DzPgGj5r.js): si cambia el
    # contenido, cambia el nombre. Se pueden cachear para siempre sin riesgo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Los JSON de contenido sí cambian sin cambiar de nombre, y el objetivo es
    # poder editarlos y ver el cambio al recargar. Sin caché.
    location /data/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
