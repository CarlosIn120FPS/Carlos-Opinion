<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- El servidor sustituye __TOKEN__ al servir esta página. En modo local se
     queda tal cual y no se comprueba: allí no hay nadie más escuchando. -->
<meta name="panel-token" content="__TOKEN__">
<title>Panel · Carlos' Opinion</title>
<style>
  :root {
    --fondo: #0f172a; --panel: #1e293b; --panel2: #273449;
    --borde: #334155; --texto: #e2e8f0; --suave: #94a3b8;
    --lila: #a78bfa; --azul: #60a5fa; --amarillo: #fbbf24; --verde: #34d399;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fondo); color: var(--texto);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #app { display: grid; grid-template-columns: 220px 320px 1fr; height: 100vh; }
  @media (max-width: 900px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
    #lista { max-height: 30vh; }
  }

  aside, #lista { border-right: 1px solid var(--borde); overflow-y: auto; }
  aside { padding: 16px 12px; background: #0b1220; }
  aside h1 { font-size: 15px; margin: 0 0 4px; color: var(--lila); }
  aside .modo { font-size: 12px; color: var(--suave); margin-bottom: 20px; }
  aside button {
    display: block; width: 100%; text-align: left; margin-bottom: 6px;
    padding: 10px 12px; border-radius: 8px; border: 1px solid transparent;
    background: transparent; color: var(--texto); font: inherit; cursor: pointer;
  }
  aside button:hover { background: var(--panel); }
  aside button[aria-current="true"] {
    background: linear-gradient(90deg, #7c3aed, #3b82f6); font-weight: 600;
  }

  #lista { background: #101a2e; }
  #buscador {
    width: 100%; padding: 10px 12px; border: 0; border-bottom: 1px solid var(--borde);
    background: #0b1220; color: var(--texto); font: inherit; outline: none;
  }
  .fila {
    padding: 11px 14px; border-bottom: 1px solid #1e293b; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .fila:hover { background: var(--panel); }
  .fila[aria-current="true"] { background: var(--panel2); box-shadow: inset 3px 0 0 var(--lila); }
  .fila .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pin { font-size: 11px; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
  .pin.nota { background: #422006; color: var(--amarillo); }
  .pin.diario { background: #2e1065; color: var(--lila); }
  .pin.pendiente { background: #431407; color: #fdba74; }

  main { overflow-y: auto; padding: 24px 28px 80px; }
  .vacio { color: var(--suave); margin-top: 20vh; text-align: center; }
  h2 { margin: 0 0 2px; font-size: 26px; }
  .jp { color: var(--suave); font-size: 13px; margin-bottom: 22px; }
  h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--lila); margin: 30px 0 12px; padding-bottom: 6px;
    border-bottom: 1px solid var(--borde);
  }
  label { display: block; font-size: 13px; color: var(--suave); margin-bottom: 5px; }
  .campo { margin-bottom: 16px; }
  input, textarea, select {
    width: 100%; padding: 9px 11px; border-radius: 8px;
    border: 1px solid var(--borde); background: var(--panel); color: var(--texto);
    font: inherit; outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--lila); }
  textarea { min-height: 78px; resize: vertical; }
  .guardado { color: var(--verde); font-size: 12px; margin-left: 8px; }

  .nueva { background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 14px; }
  .nueva .linea { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .nueva .linea > div { flex: 1; min-width: 90px; }
  button.principal {
    padding: 9px 20px; border: 0; border-radius: 8px; cursor: pointer; font: inherit;
    font-weight: 600; color: #fff; background: linear-gradient(90deg, #7c3aed, #3b82f6);
  }
  button.principal:disabled { opacity: .45; cursor: default; }
  button.fantasma {
    background: transparent; border: 1px solid var(--borde); color: var(--suave);
    border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 12px;
  }
  button.fantasma:hover { color: #fca5a5; border-color: #7f1d1d; }

  .grupo { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--azul); margin: 18px 0 8px; }
  .entrada {
    background: var(--panel); border: 1px solid var(--borde); border-left: 3px solid var(--lila);
    border-radius: 8px; padding: 11px 13px; margin-bottom: 9px;
  }
  .entrada .cab { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .entrada .et { font-weight: 600; color: var(--lila); font-size: 13px; }
  .entrada .rt { color: var(--amarillo); font-weight: 600; font-size: 13px; }
  .entrada .fe { color: var(--suave); font-size: 11px; margin-left: auto; }
  #aviso {
    position: fixed; bottom: 18px; right: 18px; padding: 11px 16px; border-radius: 8px;
    background: #7f1d1d; color: #fee2e2; max-width: 380px; display: none;
  }
</style>
</head>
<body>
  <div id="app">
    <aside>
      <h1>Panel privado</h1>
      <div class="modo" id="modo"></div>
      <div id="secciones"></div>
      <div id="estado" class="modo" style="margin-top:18px"></div>
    </aside>
    <div id="lista"><input id="buscador" type="search" placeholder="Buscar..." autocomplete="off"></div>
    <main id="detalle"><p class="vacio">Elige una ficha de la izquierda.</p></main>
  </div>
  <div id="aviso"></div>
  <script type="module" src="./panel.js"></script>
</body>
</html>
